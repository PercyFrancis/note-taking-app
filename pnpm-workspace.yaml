packages:
  - '.'

# The hoisted linker has an intermittent cold-install race with patchedDependencies.
# Keep package links isolated so the Excalidraw patch is applied deterministically.
nodeLinker: isolated

allowBuilds:
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
patchedDependencies:
  '@excalidraw/excalidraw@0.18.1': patches/@excalidraw__excalidraw@0.18.1.patch
